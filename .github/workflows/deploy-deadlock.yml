name: Deploy Deadlock site

on:
  push:
    branches: [main]
    paths: ['sites/deadlock/**', 'packages/core/**', 'package-lock.json', '.github/workflows/deploy-deadlock.yml']
  schedule:
    - cron: '17 5 * * *'   # every day at 05:17 UTC: fresh stats
  workflow_dispatch:

concurrency:
  group: deploy-deadlock
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reuse optimized images between builds
        uses: actions/cache@v4
        with:
          path: sites/deadlock/node_modules/.astro
          key: deadlock-astro-${{ github.run_id }}
          restore-keys: deadlock-astro-
      - name: Build
        run: npm run build -w sites/deadlock
        env:
          SITE_URL: ${{ vars.DEADLOCK_SITE_URL }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          CF_ANALYTICS_TOKEN: ${{ vars.DEADLOCK_CF_ANALYTICS_TOKEN }}
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true'
        run: |
          npx --yes wrangler@4 pages project create deadlock-meta --production-branch=main || true
          npx --yes wrangler@4 pages deploy sites/deadlock/dist --project-name=deadlock-meta --branch=main
