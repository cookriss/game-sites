name: Daily refresh

# Commits a timestamp once a day so Cloudflare Pages rebuilds every site
# (release countdowns and any fetched data stay current).
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: date -u +%Y-%m-%dT%H:%M:%SZ > .last-refresh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add .last-refresh
          git commit -m "Daily refresh" || exit 0
          git push
