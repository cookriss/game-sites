name: Daily stats refresh

# Cloudflare Pages is connected to this repo and rebuilds on every push to main.
# This job pushes a tiny timestamp commit once a day so every site rebuilds with fresh stats.
on:
  schedule:
    - cron: '17 5 * * *'   # 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .last-refresh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-refresh
          git commit -m "Daily stats refresh"
          git push
